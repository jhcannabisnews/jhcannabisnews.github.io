name: Update subscriber goal bar

on:
  schedule:
    - cron: "40 * * * *"   # every hour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: subs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read subscriber count and update the home page
        run: python3 tools/subs.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Update subscriber goal bar"
          git pull --rebase -q || true
          git push
